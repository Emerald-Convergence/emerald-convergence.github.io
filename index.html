<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c1216">
  <meta name="description" content="Emerald Convergence, a Pokémon Emerald ROM hack in development.">
  <title>Emerald Convergence</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(ellipse at 20% 15%, #193f39 0, transparent 45%), radial-gradient(ellipse at 85% 85%, #302044 0, transparent 45%), #0c1216; color: #ebf4ef; }
    main { width: min(92%, 740px); padding: 6rem 0; }
    .eyebrow { color: #9bc9b1; font-size: .8rem; font-weight: 700; letter-spacing: .23em; text-transform: uppercase; }
    h1 { font-size: clamp(3.4rem, 10vw, 6.5rem); line-height: .98; letter-spacing: -.07em; margin: 1.5rem 0; }
    h1 span { display: block; color: #98d7b3; }
    h1 em { display: block; color: #b9a3e3; font-style: normal; }
    p { max-width: 35rem; color: #c8d6d0; line-height: 1.7; font-size: 1.12rem; }
    .status { display: inline-flex; align-items: center; gap: .6rem; border: 1px solid #466257; border-radius: 99px; padding: .6rem .95rem; margin-top: 1.3rem; color: #bfe2cd; font-size: .85rem; }
    .status:before { content: ""; width: .55rem; height: .55rem; border-radius: 50%; background: #98d7b3; }
    footer { margin-top: 4rem; color: #899c94; font-size: .78rem; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">A Pokémon Emerald ROM hack</div>
    <h1><span>Emerald</span><em>Convergence</em></h1>
    <p>A new journey through Hoenn, where Void Rifts reshape the familiar. The project is currently in development.</p>
    <div class="status">In development</div>
    <footer>Independent fan project. Not affiliated with Nintendo, Game Freak, or The Pokémon Company.</footer>
  </main>
</body>
</html>
